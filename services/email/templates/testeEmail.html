<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Disparo</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 0; }
    .container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #e0e0e0; padding: 32px; }
    h1 { color: #003366; font-size: 22px; }
    p { color: #333; line-height: 1.6; }
    .footer { font-size: 13px; color: #888; margin-top: 32px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Olá!</h1>
    <p>Este é um teste de disparo automático de e-mail.</p>
    <p>Se você recebeu esta mensagem, o sistema de envio está funcionando corretamente.</p>
    <div class="footer">
      E-mail enviado automaticamente para fins de teste.<br>
      Obrigado!
    </div>
  </div>
</body>
</html>
